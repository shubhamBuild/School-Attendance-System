<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>School Attendance System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #f4f7fc; }
        .main-card {
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            border: none;
        }
        .navbar { background: linear-gradient(90deg,#4e54c8,#8f94fb); }
        .navbar-brand {
            color: white !important;
            font-weight: bold;
            font-size: 24px;
        }
        .btn-custom {
            background: #4e54c8;
            color: white;
            border: none;
            border-radius: 10px;
            padding: 10px 20px;
        }
        .btn-custom:hover { background: #3d42a4; }
    </style>
    {% block css %}{% endblock %} 
</head>
<body>

<nav class="navbar navbar-expand-lg mb-4">
    <div class="container">
        <a class="navbar-brand" href="{% url 'dashboard' %}">School Attendance</a>
    </div>
</nav>

<div class="container">
    {% block content %}
    {% endblock %}
</div>

</body>
</html>
